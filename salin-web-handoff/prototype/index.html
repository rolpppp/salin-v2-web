      { id: "pay", t: "First pay recorded", done: state.paydays.length > 0 },
      { id: "log", t: "First spending logged", done: state.spends.some((x) => !x.pre) },
      { id: "review", t: "First week closed", done: state.weekClosed },
    ];
    if (state.starting) return [
      state.firstStep,
      { id: "pay", t: "First pay has a job", done: state.paydays.length > 0 },
      { id: "move", t: "Transfers made", done: state.paydays.length > 0 && pendingMoves() === 0 },
      { id: "log", t: "First spending logged", done: state.spends.some((x) => !x.pre) },
      { id: "review", t: "First week closed", done: state.weekClosed },
    ];
    return [
      state.firstStep,
      { id: "assign", t: "All money in has a job", done: !state.inbox.length },
      { id: "move", t: "Transfers made", done: !state.inbox.length && state.done.length > 0 && pendingMoves() === 0 },
      { id: "living", t: "Living above zero", done: !overspent() },
      { id: "review", t: "Week closed", done: state.weekClosed },

  }

  function nextStepHTML() {

    const done = steps.filter((s) => s.done).length;
    /* Waiting income always comes first, even in the first week's checklist. */
    const next = state.starting && state.inbox.length ? { id: "assign" } : steps.find((s) => !s.done);
    let body;
    if (!next) {

      </div>
    </section>`;
  }

    $("#today").innerHTML = `
      <div class="hello">
        <div><h1>Good evening, ${esc(state.user.name)}</h1><p>Sunday, Oct 11 · ${days} day${days > 1 ? "s" : ""} until payday${state.mode === "demo" ? " " + SAMPLE : ""}</p></div>

        </div>
        <div class="shelf" style="--cols:${shelfGroups.map((g) => Math.max(2, g.ids.length) + "fr").join(" ")}">
          ${shelfGroups.map((g) => `<div class="group">
            <div class="g-label">${g.name} <small>${g.hint}</small></div>
            <div class="g-cols" style="--gc:${Math.max(2, g.ids.length)}">${g.ids.map((id) => slotHTML(BY[id], L[id], pend, prev)).join("")}</div>
          </div>`).join("")}
        </div>
        <div class="shelf-foot"><span>Click a bucket to see what went in and out. Ribbons are to scale: full height is ${whole(SCALE)}.</span><span><b class="num">${peso(Object.values(L).reduce((a, v) => a + v, 0))}</b> in all buckets</span></div>
      </section>

      ${goalsHTML(prev)}`;
  }

  function slotHTML(b, l, pend, prev) {
    const px = shelfPx();
    const r = Math.max(0, l) / SCALE;
    const isRent = b.id === "rent" && !!state.rentRule;
    const cls = l < 0 ? "over" : l === 0 ? "zero" : "";
    let pendHTML = "";
    if (pend) {
      const add = pend[b.id] || 0;
      const grow = Math.max(0, l + add) - Math.max(0, l);
      if (grow > 0) {
        const tall = (grow / SCALE) * px >= 28;
        pendHTML = `<div class="pending ${l > 0 ? "" : "alone"}" style="height:calc(var(--shelf-h) * ${(grow / SCALE).toFixed(4)})">${tall ? `<span>+${fmt(add)}</span>` : ""}</div>${tall ? "" : `<div class="pending-lbl">+${fmt(add)}</div>`}`;
      }
    }
    if (prev && prev.pend) {
      const add = prev.pend[b.id] || 0;
      const from = Math.max(0, prev.lefts[b.id]);
      const grow = Math.max(0, prev.lefts[b.id] + add) - from;
      if (grow > 0) pendHTML = `<div class="pending ghosting" style="top:calc(var(--shelf-h) * ${(from / SCALE).toFixed(4)});height:calc(var(--shelf-h) * ${(grow / SCALE).toFixed(4)})"></div>`;
    }
    let tag = "";
    if (isRent) tag = `<div class="tag ghost">Starts ${rentMonth()}. Until then it goes to Emergency.</div>`;
    else if (b.planless && l === 0) tag = `<div class="tag ghost">Scholarship money lands here, kept whole.</div>`;
    else if (l < 0) tag = `<div class="tag warm">Needs ${peso(-l)}</div>`;
    const delta = prev && l > prev.lefts[b.id] ? `<span class="delta">+${fmt(l - prev.lefts[b.id])}</span>` : "";
    const showDelta = delta && r * px >= 34;
    const shownAmt = prev ? prev.lefts[b.id] : l;
    return `<button class="slot" type="button" data-open="${b.id}" data-id="${b.id}" style="--c:${col(b.id)}" aria-label="${b.name}: ${peso(l)} left, kept in ${esc(b.acct)}">
      <div class="s-head"><span class="s-name"><i></i><span>${b.short}</span></span><span class="s-amt ${cls}" data-to="${l}">${l < 0 ? "−" : ""}<span class="c">₱</span><span class="v">${fmt(Math.abs(shownAmt))}</span></span><span class="s-acct">${esc(b.acct)}</span></div>
      <div class="rail" aria-hidden="true"></div>
      <div class="hang" aria-hidden="true">
        ${l > 0 ? `<div class="ribbon ${r * px < 14 ? "tiny" : ""}" style="height:calc(var(--shelf-h) * ${r.toFixed(4)})">${showDelta ? delta : ""}</div>` : ""}
        ${delta && !showDelta ? `<div class="delta-lbl">${delta.replace('class="delta"', "")}</div>` : ""}
        ${isRent || l < 0 || (b.planless && l === 0) ? tag + pendHTML : pendHTML + tag}
      </div>
    </button>`;
  }

  const G = (id) => state.goals.find((g) => g.id === id);
  /* What a goal has saved: the Emergency fund is its bucket's balance; other goals take a share of what went into a bucket. */
  function goalSaved(g, prev) {
    if (g.id === "em") return prev ? prev.lefts.emergency : left("emergency");
    if (!g.feed) return 0;
    const inn = prev ? (prev.ins ? prev.ins[g.feed.b] : g.feed.b === "sinking" ? prev.sinkIn : inOf(g.feed.b)) : inOf(g.feed.b);
    return Math.round((inn * g.feed.share) / 100);
  }
  const feedLabel = (f) => `${f.share === 100 ? "" : f.share === 50 ? "half of " : f.share + "% of "}${BY[f.b].name}`;
  function goalsHTML(prev) {
    const payEm = state.paydays.find((p) => (p.alloc.emergency || 0) > 0);
    const goals = state.goals.slice(0, 3).map((g) => {
      const saved = goalSaved(g), was = prev ? goalSaved(g, prev) : saved, togo = Math.max(0, g.target - saved);
      let sub;
      if (g.id === "em") sub = saved >= g.target ? `Target reached.${state.switchOn ? " Plan B is active." : ""}` : `<b>${peso(togo)}</b> to go. ${payEm ? `About ${Math.ceil(togo / payEm.alloc.emergency)} more paydays like ${payEm.date}${state.switchOn ? ", then Plan B starts" : ""}.` : "Your first payday split starts filling it."}`;
      else if (g.feed) sub = `<b>${peso(togo)}</b> to go. Fed by ${feedLabel(g.feed)}.`;
      else sub = g.hint || "Not started yet.";
      return { name: g.name, saved, was, target: g.target, main: g.id === "em", sub };
    });
    const more = state.goals.slice(3).map((g) => g.name);
    if (!goals.length) return `<p class="more-goals">Saving toward something? Add a goal in <a href="#plans" data-go="plans">Plans</a>.</p>`;
    return `<section class="goals ${goals.length < 3 ? "n" + goals.length : ""}" aria-label="Goals">
      ${goals.map((g) => {
        const p = Math.min(1, g.saved / g.target);
        const pw = Math.min(1, g.was / g.target);
        const crossed = MILESTONES.filter((m) => pw < m && p >= m);
        return `<article class="card goal ${g.main ? "main" : ""}">
          <div class="goal-top"><h3>${esc(g.name)}</h3><span class="pct">${Math.floor(p * 100)}%</span></div>
          <div class="gbar" role="progressbar" aria-label="${esc(g.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p * 100)}"><div class="gbar-fill" data-p="${p}" style="--p:${prev ? pw : p}"></div></div>
          <div class="ticks" aria-hidden="true">${MILESTONES.slice(0, 3).map((m) => `<span class="tick-m ${(prev ? pw : p) >= m ? "hit" : ""}" data-m="${m}" data-p="${p}" style="left:${m * 100}%">${m * 100}%</span>`).join("")}</div>
          <p class="goal-sub">${g.sub}</p>
          ${crossed.length || (g.main && state.milestone) ? `<span class="milestone">${I.spark} Passed ${Math.round((crossed.length ? crossed[crossed.length - 1] : state.milestone) * 100)}% today</span>` : ""}
        </article>`;
      }).join("")}
    </section>
    ${more.length ? `<p class="more-goals">${more.map(esc).join(" and ")} ${more.length > 1 ? "goals are" : "goal is"} in <a href="#plans" data-go="plans">Plans</a>.</p>` : `<p class="more-goals">Add or change goals in <a href="#plans" data-go="plans">Plans</a>.</p>`}`;
  }

  /* Signature motion: ribbons grow into their dashed previews while amounts count up. */
  function playGrow(prev) {
    const px = shelfPx();
    BUCKETS.forEach((b, i) => {
      const slot = $(`.slot[data-id="${b.id}"]`); if (!slot) return;
      const from = prev.lefts[b.id], to = left(b.id);
      if (from === to) return;
      const amt = $(".s-amt .v", slot);
      const rib = $(".ribbon", slot);
      const d = ((Math.max(0, to) - Math.max(0, from)) / SCALE) * px;
      const delay = i * 60;
      countUp(amt, Math.abs(from), Math.abs(to), 900, delay);
      const chip = rib && $(".delta", rib);
      if (reduce()) return;
      if (rib && d > 0) rib.animate([{ clipPath: `inset(0 0 ${Math.min(d, rib.offsetHeight)}px 0)` }, { clipPath: "inset(0 0 0 0)" }], { duration: 900, delay, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" });
      const ghost = $(".pending.ghosting", slot);
      if (ghost) ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: delay + 800, easing: "ease", fill: "forwards" });
      const lbl = $(".delta-lbl", slot);
      if (lbl) lbl.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 260, delay: delay + 700, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" });
      if (chip) chip.animate([{ opacity: 0, transform: "translate(-50%, 6px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duration: 260, delay: delay + 700, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" });
    });
    countUp($("#safe-amt"), prev.safe, safe(), 900, 200, true);
    setTimeout(() => $$(".gbar-fill").forEach((t) => t.style.setProperty("--p", t.dataset.p)), reduce() ? 0 : 450);
    setTimeout(() => $$(".tick-m").forEach((t) => { if (Number(t.dataset.p) >= Number(t.dataset.m)) t.classList.add("hit"); }), reduce() ? 0 : 1050);
    $$(".pending.ghosting").forEach((g) => { if (reduce()) g.remove(); });
    $$(".milestone").forEach((m) => { if (!reduce()) m.animate([{ opacity: 0, transform: "translateY(4px) scale(0.96)" }, { opacity: 1, transform: "none" }], { duration: 280, delay: 1300, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" }); });
  }
  function countUp(el, from, to, dur, delay, withCur) {
    if (!el) return;
    const paint = (v) => (el.innerHTML = withCur ? `<span class="cur">₱</span>${fmt(v)}` : fmt(v));
    if (reduce()) { paint(to); return; }
    const start = performance.now() + delay;
    const ease = (t) => 1 - Math.pow(1 - t, 4);
    const tick = (now) => {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      paint(Math.round(from + (to - from) * ease(t)));
      if (t < 1) requestAnimationFrame(tick);
    };
    paint(from); requestAnimationFrame(tick);
  }

  /* Peak moment: a short burst in bucket colors, only for real completions (payday done, week closed). */
  function burst(host) {
    if (!host || reduce()) return;
    const layer = document.createElement("div"); layer.className = "burst"; layer.setAttribute("aria-hidden", "true");
    host.appendChild(layer);
    const colors = BUCKETS.map((b) => getComputedStyle(document.documentElement).getPropertyValue(`--b-${b.id}`).trim());
    const w = host.clientWidth, h = host.clientHeight;
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("i");
      p.style.background = colors[i % colors.length];
      p.style.left = `${w * 0.18 + Math.random() * w * 0.12}px`;
      p.style.top = `${h * 0.25}px`;
      layer.appendChild(p);
      const dx = (Math.random() * 0.9 + 0.05) * w * (i % 2 ? 1 : 0.6);
      const dy = -40 - Math.random() * 70;
      const rot = (Math.random() * 360 - 180) | 0;
      p.animate([
        { opacity: 1, transform: "translate(0,0) rotate(0deg) scale(0.9)" },
        { opacity: 1, transform: `translate(${dx * 0.6}px, ${dy}px) rotate(${rot / 2}deg) scale(1)`, offset: 0.45 },
        { opacity: 0, transform: `translate(${dx}px, ${dy + 90}px) rotate(${rot}deg) scale(0.9)` },
      ], { duration: 1200 + Math.random() * 300, delay: Math.random() * 120, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "forwards" });
    }
    setTimeout(() => layer.remove(), 1800);
  }

  /* ---------- Money in ---------- */
  function slipHTML(it) {
    const s = SRC(it.src), chosen = howOf(it), h = chosen || "plan", alloc = previewFor(it), p = state.plan[activePlan()];
    const pctOf = (bid) => h === "plan" ? (state.rentRule && bid === "rent" ? "0%" : state.rentRule && bid === "emergency" ? (p.emergency || 0) + (p.rent || 0) + "%" : (p[bid] || 0) + "%") : h === "own" ? ((s.own[bid] || 0) + "%") : "";
    const shown = BUCKETS.filter((b) => (alloc[b.id] || 0) > 0 || (h === "plan" && !b.planless && isOn(b.id)));
    return `
      <div class="r-title">Split slip</div>
      <div class="r-meta">Sun Oct 11 2026 · ${chosen ? howLabel(it) : "Preview \u00b7 Plan " + activePlan()}</div>
      <div class="r-rule"></div>
      <div class="r-ln"><span>${it.date} ${esc(s.name)}</span><span class="d"></span><span>${fmt(it.amount)}</span></div>
      <div class="r-rule"></div>
      ${shown.map((b) => { const v = alloc[b.id] || 0; return `<div class="r-ln ${v ? "" : "dim"}" style="--c:${col(b.id)}"><i class="dotc"></i><span>${b.short}</span><span class="d"></span><span class="p">${pctOf(b.id)}</span><span style="min-width:80px;text-align:right">${fmt(v)}</span></div>`; }).join("")}
      <div class="r-rule"></div>
      <div class="r-ln total"><span>Total</span><span class="d"></span><span>${fmt(it.amount)}</span></div>
      <p class="r-foot">${h === "plan" ? (state.rentRule ? "Emergency includes " + BY.rent.name + "'s share until " + rentStarts() + "." : "Split by your plan's percentages.") : h === "own" ? s.name + " has its own split, set in Plans." : "Kept whole, nothing is split."}</p>`;
  }
  function slipAllHTML() {
    const tot = {}; let sum = 0;
    state.done.forEach((it) => { sum += it.amount; Object.entries(it.alloc).forEach(([k, v]) => (tot[k] = (tot[k] || 0) + v)); });
    return `
      <div class="r-title">Money-in slip</div>

      ${state.done.map((it) => `<div class="r-ln"><span>${it.date} ${esc(it.name)}</span><span class="d"></span><span>${fmt(it.amount)}</span></div>`).join("")}
      <div class="r-rule"></div>
      ${BUCKETS.filter((b) => tot[b.id]).map((b) => `<div class="r-ln" style="--c:${col(b.id)}"><i class="dotc"></i><span>${b.short}</span><span class="d"></span><span style="min-width:80px;text-align:right">${fmt(tot[b.id])}</span></div>`).join("")}
      <div class="r-rule"></div>
      <div class="r-ln total"><span>Total</span><span class="d"></span><span>${fmt(sum)}</span></div>
      <div class="r-ln"><span>Left to assign</span><span class="d"></span><span>0.00</span></div>`;
  }

  function inboxRowHTML(it, open) {
    const s = SRC(it.src), h = howOf(it), alloc = allocFor(it);
    const opts = [];
    if (s.rule !== "ask" && !(s.rule === "own" && ownTotal(s) !== 100)) opts.push(["rule", `Use its rule`, ruleLabel(s)]);
    if (s.rule !== "plan") opts.push(["plan", `Split by Plan ${activePlan()}`, "Your usual payday split."]);
    opts.push(["one", "All to one bucket", "For a one-off."]);
    const cur = !it.how || it.how === "rule" ? (h ? "rule" : "") : it.how;
    return `<div class="inq-item ${open ? "open" : ""}" style="--c:${kindCol(s.kind)}">
      <button class="inq-row" type="button" data-act="sel" data-id="${it.id}" aria-expanded="${open}">
        <span class="kdot"></span>
        <span class="inq-main"><b>${s.name}</b> ${kindChip(s)}${it.sample ? ' <span class="sample">Sample</span>' : ""}
          <small>${it.date} · landed in ${it.landed || s.landed}${it.aud ? ` · A$${fmt(it.aud)} sent, rate ${(it.amount / it.aud).toFixed(2)}` : ""} · ${h ? howLabel(it) : `<b class="needs">${s.rule === "own" && ownTotal(s) !== 100 ? `Its split adds to ${ownTotal(s)}%, fix it in Plans` : "Needs a job"}</b>`}</small></span>
        <span class="inq-amt">${peso(it.amount)}</span>
      </button>
      ${open ? `<div class="inq-detail">
        <div class="choice" role="radiogroup" aria-label="Job for ${s.name}">
          ${opts.map(([v, t, d]) => `<label class="opt"><input type="radio" name="how" value="${v}" data-item="${it.id}" ${cur === v ? "checked" : ""}><span class="opt-box"><b>${t}</b><span>${d}</span></span></label>`).join("")}
        </div>
        ${h === "one" ? `<div class="one-bucket"><label for="one-b">Bucket</label><select id="one-b" data-item="${it.id}">${BUCKETS.filter((b) => b.id !== "rent" && (isOn(b.id) || b.id === "emergency")).map((b) => `<option value="${b.id}" ${(it.one || "emergency") === b.id ? "selected" : ""}>${b.name}</option>`).join("")}</select></div>` : ""}
        ${!alloc ? `<p class="muted" style="font-size:13.5px;margin-top:12px">Pick a job above to see where it goes.</p>` : ""}
        <div class="bars" aria-label="Where it goes">${BUCKETS.filter((b) => alloc && (alloc[b.id] || 0) > 0).map((b) => `<div class="bar-row" style="--c:${col(b.id)}"><span class="n"><i></i>${b.short}</span><span class="track"><i style="transform:scaleX(${(alloc[b.id] / it.amount).toFixed(3)})"></i></span><span class="v">${fmt(alloc[b.id])}</span></div>`).join("")}</div>
        ${h === "plan" ? `<div class="why"><div>${I.info}<span>${state.rentRule ? `${BY.rent.name}'s share goes to your Emergency fund until ${rentStarts()}. ` : ""}${state.switchOn ? `Plan A runs until the Emergency fund reaches ${whole(EMERGENCY_TARGET)}.` : "Your plan's percentages, applied to this amount."}</span></div></div>` : ""}
        ${state.inbox.length > 1 && alloc ? `<div class="row" style="margin-top:14px"><button class="btn btn-soft" data-act="confirm-one" data-id="${it.id}" type="button">Confirm just this one</button></div>` : ""}
      </div>` : ""}
    </div>`;
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const shortDate = (iso) => `${MONTHS[Number(iso.slice(5, 7)) - 1]} ${Number(iso.slice(8, 10))}`;
  const parseMoney = (v) => { const n = Number(String(v).replace(/[,\s\u20b1]/g, "")); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
  function addIncomeHTML() {
    const d = state.draft, src = SRC(d.src) || state.sources[0];
    const landed = d.landed || src.landed;
    const cents = parseMoney(d.amount), aud = parseMoney(d.aud);
    return `<section class="card add-inc" aria-labelledby="ai-h">

        <div class="inc-grid">

          <label class="fld"><span>Amount received</span><span class="money"><i>\u20b1</i><input id="inc-amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${d.amount}" aria-describedby="inc-err"></span></label>

          ${src.kind === "salary" ? `<label class="fld"><span>Sent from AUD <em>optional</em></span><span class="money"><i>A$</i><input id="inc-aud" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${d.aud}"></span></label>
          <p class="fld-note" id="inc-rate">${cents > 0 && aud > 0 ? `Rate you got: \u20b1${(cents / aud).toFixed(2)} per A$1` : "Add the A$ amount to track the rate you got."}</p>` : ""}
        </div>
        <p class="inc-rule">${howOf({ src: src.id }) ? `Its job: <b>${ruleLabel(src)}</b>.` : src.rule === "ask" ? "You'll pick its job after adding it." : `Its own split doesn't add to 100% yet, so you'll pick a job after adding it.`} <a href="#plans" data-go="plans">Change rules in Plans</a></p>
        <p class="err" id="inc-err" role="alert">${d.err}</p>

  }

  function renderPayday() {
    const n = state.inbox.length;
    const { moves, keeps } = allMoves();
    const sent = moves.filter(isSent).length;
    const rd = ready(), rdTotal = rd.reduce((a, i) => a + i.amount, 0), unset = state.inbox.filter((i) => !howOf(i));
    const allDone = !n && state.done.length && sent === moves.length;
    const addBtn = state.addIncome ? "" : `<button class="btn btn-soft" data-act="add-income" type="button">+ Add income</button>`;
    if (!n && !state.done.length) { $("#payday").innerHTML = `<div class="view-h vh-row"><div><h1>Nothing waiting</h1><p>Money from any source shows up here: salary, scholarship, side hustle, allowance.</p></div>${addBtn}</div>${state.addIncome ? `<div class="steps" style="max-width:820px">${addIncomeHTML()}</div>` : ""}`; return; }
    const sel = state.sel === null ? null : state.inbox.find((i) => i.id === state.sel) || unset[0] || state.inbox[0];

    $("#payday").innerHTML = `
      <div class="view-h vh-row"><div><h1>${allDone ? "Every peso has a home" : n ? "Give your money a job" : "Move the money"}</h1>
        <p>${allDone ? "Everything that came in is split and sent." : n ? `${n} ${n > 1 ? "incomes are" : "income is"} waiting. Each source has its own rule, so most of the work is done. Check, then confirm.` : "Tick each transfer once you've sent it in your banking app."}</p></div>${addBtn}</div>
      <div class="two">
        <div class="steps">
          ${state.addIncome ? addIncomeHTML() : ""}
          <section class="card step s-choose ${n ? "" : "done"}" aria-labelledby="s1">
            <div class="step-h"><span class="step-n">${n ? "1" : I.check}</span><h2 id="s1">Choose each one's job</h2><span class="sub">${state.done.length} of ${state.done.length + n} done</span></div>
            ${n ? `<div class="inq">${state.inbox.map((it) => inboxRowHTML(it, sel && it.id === sel.id)).join("")}</div>
              <div class="row" style="margin-top:16px;align-items:center">
                <button class="btn ${state.addIncome ? "btn-soft" : "btn-primary"}" data-act="confirm-all" type="button" ${rd.length ? "" : "disabled"}>${rd.length === n && n > 1 ? `Confirm all ${n}` : rd.length > 1 ? `Confirm ${rd.length}` : "Confirm"} · ${whole(rdTotal)}</button>
                <span class="muted" style="font-size:13.5px">${unset.length ? `${unset.map((i) => SRC(i.src).name).join(" and ")} need${unset.length > 1 ? "" : "s"} a job first.` : n > 1 ? "Each one uses the job shown on its row." : ""}</span>
              </div>` : ""}
            ${state.done.length ? `<div class="done-list">${state.done.map((it) => `<div class="done-row"><span class="ckd">${I.check}</span><span><b>${esc(it.name)}</b> <small>${it.how}</small></span><span class="v">${fmt(it.amount)}</span></div>`).join("")}</div>` : ""}
          </section>

          ${allDone ? peakPaydayHTML() : `
          <section class="card step s-move" aria-labelledby="s2" ${state.done.length ? "" : 'aria-disabled="true"'}>
            <div class="step-h"><span class="step-n">2</span><h2 id="s2" tabindex="-1">Move the money</h2><span class="sub">${state.done.length ? `${sent} of ${moves.length} sent` : "After you confirm"}</span></div>
            ${state.done.length ? `<div class="moves">
              ${keeps.map((k) => `<div class="move stays"><span class="box">${I.check}</span><span class="move-t"><b>Keep ${peso(k.amt)} in ${esc(k.acct)}</b><small>${k.names.join(", ")} · already there${k.netted ? ` · includes ${peso(k.netted)} kept by netting` : ""}</small></span><span></span><span class="v">${fmt(k.amt)}</span></div>`).join("")}
              ${moves.map((m) => { const more = m.sent && m.sent !== m.amt; const done = isSent(m); return `<label class="move ${done ? "is-done" : ""}"><input type="checkbox" data-move="${m.key}" data-amt="${m.amt}" ${done ? "checked" : ""}><span class="box">${I.check}</span><span class="move-t"><b>Send ${peso(more ? m.amt - m.sent : m.amt)}${more ? " more" : ""} to ${esc(m.to)}</b><small>${m.names.join(", ")} · from ${esc(m.from)}${more ? ` · ${peso(m.sent)} already sent` : ""}${m.netted ? ` · ${peso(m.netted)} less: that much stays put on the other side instead of coming back` : ""}</small></span><span class="stamp">Sent</span><span class="v">${fmt(m.amt)}</span></label>`; }).join("")}
            </div>` : `<p class="muted" style="font-size:14px">Transfers appear here, grouped by account, once you confirm.</p>`}
          </section>`}
        </div>

        <div class="receipt-col">
          <div class="receipt-shadow"><div class="receipt" aria-label="Slip">
            <img class="r-logo" src="${LOGO}" alt="">
            ${sel ? slipHTML(sel) : slipAllHTML()}
            <div class="bigstamp ${sel ? "" : "on"}" aria-hidden="true">ALL IN<small>OCT 11</small></div>
          </div></div>
        </div>
      </div>`;
    if (allDone && state.burst === "payday") { state.burst = null; requestAnimationFrame(() => burst($(".peak"))); }
  }

  function peakPaydayHTML() {
    const total = state.done.reduce((a, it) => a + it.amount, 0);
    const k = state.done.length;
    const items = [
      `<li><span class="ck">${I.check}</span>${peso(total)} from ${k} source${k > 1 ? "s" : ""} now has a job</li>`,
      `<li><span class="ck">${I.check}</span>Your accounts match your buckets</li>`,
    ];
    if (state.wasOver && !overspent()) items.push(`<li><span class="ck">${I.check}</span>Living is back above zero</li>`);
    if (state.milestone) items.push(`<li><span class="ck sun">${I.spark}</span>Emergency fund passed ${Math.round(state.milestone * 100)}% of ${whole(EMERGENCY_TARGET)}</li>`);
    return `<section class="card peak enter s-move" aria-labelledby="peak-h" role="status">
      <h2 id="peak-h">All money in has a home.</h2>
      <ul>${items.join("")}</ul>
      <div class="row"><button class="btn btn-primary" data-go="today" type="button">See your buckets grow ${I.arrow}</button></div>
    </section>`;
  }

  /* ---------- Review ---------- */
  function renderReview() {
    const went = state.spends.reduce((s, x) => s + x.amt, 0);
    const came = assigned() + waitingTotal();
    const bySrc = {};
    state.paydays.forEach((p) => (bySrc[p.source] = (bySrc[p.source] || 0) + p.amount));
    state.inbox.forEach((it) => { const n = SRC(it.src).name; bySrc[n] = (bySrc[n] || 0) + it.amount; });
    /* Left amounts, not allocations, so the slip still adds up when money is spent from a set-aside (e.g. a BIR payment from Tax). */
    const putAway = SAVE.reduce((a, id) => a + left(id), 0);
    const over = overspent();
    const raised = state.plan.A.living > state.livingBase;
    const livingSpends = state.spends.filter((x) => x.b === "living");
    const byCat = livingSpends.reduce((acc, x) => { acc[x.cat] = (acc[x.cat] || 0) + x.amt; return acc; }, {});
    const topId = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])[0];
    const top = topId ? { name: (state.cats.find((c) => c.id === topId) || { name: "One category" }).name, amt: byCat[topId] } : null;
    const fixDone = !over || raised;
    const checks = [
      { t: "Every peso has a job", on: !state.inbox.length },
      { t: "Transfers made", on: !state.inbox.length && state.done.length > 0 && pendingMoves() === 0 },
      { t: "Living above zero", on: !over },
    ];
    const em = left("emergency");
    const rows = SPEND.filter(isOn).map((id) => ({ id, spent: outOf(id), had: inOf(id) + coverIn(id) }));
    const maxV = Math.max(1, ...rows.map((r) => Math.max(r.spent, r.had)));

    $("#review").innerHTML = `
      <div class="view-h"><h1>Week of Oct 5 – 11</h1><p>Five minutes: look back, fix one thing, then close the week.</p>
        <div class="stepper" aria-label="Review progress">
          <span class="on"><i>${I.check}</i>Look back</span>
          <span class="${fixDone ? "on" : ""}"><i>${fixDone ? I.check : "2"}</i>Fix one thing</span>
          <span class="${state.weekClosed ? "on" : ""}"><i>${state.weekClosed ? I.check : "3"}</i>Close the week</span>
        </div></div>
      <div class="review">
        <div class="receipt-col">
          <div class="receipt-shadow"><div class="receipt" aria-label="Week slip">
            <img class="r-logo" src="${LOGO}" alt="">
            <div class="r-title">Week slip</div>
            <div class="r-meta">Oct 5 – Oct 11 2026 · ${esc(state.user.name)}</div>
            <div class="r-rule"></div>
            <div class="r-ln"><span>Came in</span><span class="d"></span><span>${fmt(came)}</span></div>
            ${Object.entries(bySrc).map(([n, v]) => `<div class="r-ln r-sub"><span>${n}</span><span class="d"></span><span>${fmt(v)}</span></div>`).join("")}
            <div class="r-ln"><span>Spent</span><span class="d"></span><span>${fmt(went)}</span></div>
            <div class="r-ln"><span>Put away</span><span class="d"></span><span>${fmt(putAway)}</span></div>
            ${isOn("tax") ? `<div class="r-ln"><span>Tax set aside</span><span class="d"></span><span>${fmt(left("tax"))}</span></div>` : ""}
            <div class="r-ln"><span>Cushions & kept whole</span><span class="d"></span><span>${fmt(left("buffer") + left("dost") + left("rent"))}</span></div>
            <div class="r-ln"><span>To assign</span><span class="d"></span><span>${fmt(waitingTotal())}</span></div>
            <div class="r-rule"></div>
            <div class="r-ln total"><span>Safe to spend</span><span class="d"></span><span>${fmt(safe())}</span></div>
            <p class="r-foot">Your first week in Salin Web, so there's no earlier week to compare yet. Next Sunday you'll see the change.</p>
            <div class="bigstamp ${state.weekClosed ? "on" : ""}" aria-hidden="true">WEEK CLOSED<small>OCT 11</small></div>
          </div></div>
        </div>

        <div class="r-cards">
          <section class="card" aria-labelledby="where-h">
            <h2 id="where-h">Where your spending went</h2>
            <div class="bars">${rows.map((r) => `<div class="bar-row" style="--c:${col(r.id)}"><span class="n"><i></i>${BY[r.id].short}</span><span class="track"><i style="transform:scaleX(${(r.spent / maxV).toFixed(3)})"></i></span><span class="v">${fmt(r.spent)}</span></div>`).join("")}</div>
            <p class="muted" style="font-size:13.5px;margin-top:12px">${state.spends.length ? `${rows.map((r) => `${BY[r.id].name} had ${peso(r.had)}`).join(" and ")} this week.${state.spends.every((x) => SPEND.includes(x.b)) ? " Nothing was spent from savings or set-asides." : ""}${state.spends.some((x) => x.sample) ? " " + '<span class="sample">Sample entries</span>' : ""}` : `Nothing logged yet. Log spending from Today${state.mode === "app" ? " or on your phone" : ""} and it shows here.`}</p>
          </section>

          <section class="card" aria-labelledby="note-h">
            <h2 id="note-h">One thing to look at</h2>
            ${(() => {
              const nextPct = state.livingBase + 1;
              const topTxt = top ? top.name.toLowerCase() : "spending";
              const troubled = over || state.covers.length || state.wasOver;
              const txt = over && !raised ? `Living ran <b>${peso(-left("living"))}</b> short.${top ? ` ${esc(top.name)} was ${peso(top.amt)} of the ${peso(outOf("living"))} spent.` : ""}`
                : raised ? `Living now gets ${state.plan.A.living}% of each payday, taken from Fun money. It starts with your next payday.`
                : state.covers.length ? `You covered Living from Buffer. If ${esc(topTxt)} stays this high, Living may need ${nextPct}% of each payday.`
                : state.wasOver ? `Living ran short earlier, and new money put it back above zero. If ${esc(topTxt)} stays this high, Living may need ${nextPct}%.`
                : !state.spends.length ? `Nothing to fix yet. Log a few days of spending and next Sunday this card points to the one thing worth changing.`
                : `Living stayed above zero all week.${putAway > 0 ? ` You have ${peso(putAway)} put away for future you.` : ""} Nothing to change.`;
              const btns = `${over ? `<button class="btn btn-soft" data-act="cover" type="button">Cover from Buffer</button>` : ""}${troubled ? (!raised ? `<button class="btn btn-soft" data-act="raise" type="button">Move 1% from Fun to Living</button>` : `<button class="btn btn-quiet" data-go="plans" type="button">Open Plans</button>`) : ""}`;
              return `<p class="honest" style="margin-top:10px">${txt}</p>${btns ? `<div class="row">${btns}</div>` : ""}`;
            })()}
          </section>

          <section class="card" aria-labelledby="goal-h">
            <h2 id="goal-h">Progress this week</h2>
            <div class="leader" style="margin-top:12px"><span>Emergency fund</span><span class="dots"></span><b class="num" style="color:var(--good)">+${fmt(em)}</b></div>
            <div class="gbar" style="margin-top:12px"><div class="gbar-fill" style="--p:${Math.min(1, em / EMERGENCY_TARGET)};background:var(--good-fill)"></div></div>
            <p class="muted" style="font-size:13.5px;margin-top:10px">${Math.floor((em / EMERGENCY_TARGET) * 100)}% of the ${whole(EMERGENCY_TARGET)}${state.switchOn ? " that switches you to Plan B" : " target"}.</p>
          </section>

          ${state.weekClosed ? `
          <section class="card peak enter" aria-labelledby="closed-h" role="status">
            <h2 id="closed-h">Week closed. Monday starts fresh.</h2>
            <ul>
              ${checks.map((c) => `<li><span class="ck" style="${c.on ? "" : "background:var(--surface-3)"}">${c.on ? I.check : ""}</span>${c.t}${c.on ? "" : " <span class='muted'>(carries into next week)</span>"}</li>`).join("")}
              <li><span class="ck sun">${I.spark}</span>You start next week with ${peso(safe())} safe to spend</li>
            </ul>
            <p class="muted" style="font-size:13.5px">Next review: Sunday, Oct 18.</p>
          </section>` : `
          <section class="card" aria-labelledby="close-h">
            <h2 id="close-h">Close the week</h2>
            <div class="checks" style="margin-top:12px">${checks.map((c) => `<div><span class="ckc ${c.on ? "on" : ""}">${I.check}</span><span>${c.t}</span></div>`).join("")}</div>
            <div class="row"><button class="btn btn-primary" data-act="close" type="button">Close the week</button></div>
            ${checks.some((c) => !c.on) ? `<p class="muted" style="font-size:13.5px;margin-top:10px">You can close with open items. They carry into next week.</p>` : ""}
          </section>`}
        </div>
      </div>`;
    if (state.weekClosed && state.burst === "week") { state.burst = null; requestAnimationFrame(() => burst($("#review .peak"))); }
  }

  /* ---------- Income sources ---------- */
  function ownEditorHTML(x) {
    const tot = Object.values(x.own).reduce((a, v) => a + Number(v || 0), 0);
    return `<div class="own-ed"><span class="own-h">Split this source's money. Leave a bucket at 0 to skip it.</span><div class="own-grid">${BUCKETS.filter((b) => b.id !== "rent" && (isOn(b.id) || x.own[b.id])).map((b) => `<label class="own-f ${x.own[b.id] ? "" : "off"}" style="--c:${col(b.id)}"><i></i><span>${b.short}</span><input type="number" min="0" max="100" step="1" id="own-${x.id}-${b.id}" data-own="${x.id}" data-b="${b.id}" value="${x.own[b.id] || 0}">%</label>`).join("")}</div>
      <span class="${tot === 100 ? "total-ok" : "total-bad"}">${tot}%${tot === 100 ? "" : " · needs 100%"}</span></div>`;
  }
  function sourcesHTML() {
    const bucketOpts = (sel) => BUCKETS.filter((b) => b.id !== "rent" && (isOn(b.id) || b.planless || b.id === sel)).map((b) => `<option value="${b.id}" ${sel === b.id ? "selected" : ""}>${b.name}</option>`).join("");
    return `<section class="card" aria-labelledby="src-h">
      <div class="sec-h"><h2 id="src-h">Income sources</h2><span class="muted" style="font-size:13.5px">Each source has a rule, so new money already knows its job.</span></div>
      <div class="srcs">
        ${state.sources.map((x) => `<div class="src-row" style="--c:${kindCol(x.kind)}">
          <div class="src-name"><span class="kdot"></span><span>${x.isNew ? `<label class="sr" for="nm-${x.id}">Name</label><input class="name-in" id="nm-${x.id}" data-srcname="${x.id}" value="${esc(x.name)}">` : `<b>${esc(x.name)}</b>`}
            <small>${kindChip(x)}<label for="ld-${x.id}">lands in</label><select class="mini" id="ld-${x.id}" data-srcland="${x.id}">${acctNames().map((a) => `<option value="${esc(a)}" ${a === x.landed ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>${x.sample ? ' <span class="sample">Sample</span>' : ""}${x.isNew ? `<button class="btn btn-quiet rm" data-act="rm-src" data-id="${x.id}" type="button">Remove</button>` : ""}</small></span></div>
          <div class="src-rule"><label class="sr" for="rule-${x.id}">Rule for ${esc(x.name)}</label>
            <select id="rule-${x.id}" data-src="${x.id}">
              <option value="plan" ${x.rule === "plan" ? "selected" : ""}>Split by my plan</option>
              <option value="own" ${x.rule === "own" ? "selected" : ""}>Its own split</option>
              <option value="whole" ${x.rule === "whole" ? "selected" : ""}>Keep it whole</option>
              <option value="ask" ${x.rule === "ask" ? "selected" : ""}>Ask me each time</option>
            </select>
            ${x.rule === "whole" ? `<label class="sr" for="bk-${x.id}">Bucket for ${esc(x.name)}</label><select id="bk-${x.id}" data-srcbucket="${x.id}">${bucketOpts(x.bucket)}</select>` : ""}
          </div>
          ${x.rule === "own" ? ownEditorHTML(x) : ""}
          <p class="src-says">${x.rule === "own" ? "" : x.rule === "ask" ? "You pick a job when the money arrives." : x.rule === "plan" ? `Uses Plan ${activePlan()} percentages.` : "Nothing is split."}</p>
        </div>`).join("")}
      </div>
      <div class="add-src">
        ${state.addOpen ? `<span class="muted" style="font-size:13.5px">What kind of income?</span>
          <div class="presets">${Object.entries(KINDS).map(([k, v]) => `<button class="preset" type="button" data-act="add-src" data-kind="${k}" style="--c:${col(v.hue)}"><span class="kdot"></span>${v.label}</button>`).join("")}</div>`
          : `<button class="btn btn-soft" data-act="open-add" type="button">+ Add income source</button>`}
      </div>
      <p class="muted" style="font-size:13px;margin-top:12px">A rule change applies to money that hasn't been given a job yet. Side hustles start with 10% for tax because freelance income is taxable.</p>
    </section>`;
  }

  /* ---------- Plans ---------- */
  /* ---------- Plans: split, income, accounts, categories, goals ---------- */
  const PLAN_TABS = [["split", "Split plan"], ["income", "Income"], ["accounts", "Accounts"], ["categories", "Categories"], ["goals", "Goals"]];
  const ACCT_TYPES = ["Bank", "E-wallet", "E-wallet + cash", "Cash", "Savings", "Investment", "Credit card"];
  const acctNames = () => state.accounts.filter((a) => !a.archived).map((a) => a.name);
  const bucketsIn = (name) => BUCKETS.filter((b) => b.acct === name);
  const sourcesIn = (name) => state.sources.filter((x) => x.landed === name);
  /* What an account should hold: each payday's share where it was sent at the time, minus spending and covers from buckets kept here now. */
  function acctHolds(name) {
    let v = 0;
    state.paydays.forEach((p) => Object.entries(p.alloc).forEach(([k, a]) => { if ((p.dest ? p.dest[k] : BY[k].acct) === name) v += a; }));
    BUCKETS.forEach((b) => { if (b.acct === name) v += coverIn(b.id) - coverOut(b.id) - outOf(b.id); });
    return v;
  }
  function acctBlockers(a) {
    const r = [];
    if (bucketsIn(a.name).length) r.push("buckets are kept here");
    if (sourcesIn(a.name).length) r.push("income lands here");
    if (state.inbox.some((i) => i.landed === a.name) || state.draft.landed === a.name) r.push("waiting income landed here");
    if (allMoves().moves.some((m) => !isSent(m) && (m.from === a.name || m.to === a.name))) r.push("a transfer is still open");
    if ((a.aud || 0) > 0 || acctHolds(a.name) > 0) r.push("it still holds money");
    return r;
  }

  function renameAccount(oldN, newN) {
    BUCKETS.forEach((b) => { if (b.acct === oldN) b.acct = newN; });
    state.sources.forEach((x) => { if (x.landed === oldN) x.landed = newN; });
    state.inbox.forEach((i) => { if (i.landed === oldN) i.landed = newN; });
    state.done.forEach((i) => { if (i.landed === oldN) i.landed = newN; });
    [...state.paydays, ...state.done].forEach((x) => { if (x.dest) Object.keys(x.dest).forEach((k) => { if (x.dest[k] === oldN) x.dest[k] = newN; }); });
    if (state.draft.landed === oldN) state.draft.landed = newN;
    const moves = {};
    Object.entries(state.moves).forEach(([k, v]) => { const [f, t] = k.split("→"); moves[(f === oldN ? newN : f) + "→" + (t === oldN ? newN : t)] = v; });
    state.moves = moves;
  }

  function splitHTML() {
    const tA = BUCKETS.reduce((s, b) => s + Number(state.plan.A[b.id] || 0), 0);
    const tB = BUCKETS.reduce((s, b) => s + Number(state.plan.B[b.id] || 0), 0);
    const msg = tA !== 100 ? `Plan A adds up to ${tA}%. ${tA > 100 ? `Take ${tA - 100}% from` : `Add ${100 - tA}% to`} another bucket.`
      : tB !== 100 ? `Plan B adds up to ${tB}%. ${tB > 100 ? `Take ${tB - 100}% from` : `Add ${100 - tB}% to`} another bucket.`
      : `Both plans add up to 100%. Changes apply from your next payday, never to past ones.`;
    const ok = tA === 100 && tB === 100;
    return `<section class="card" aria-labelledby="split-h">
        <div class="sec-h"><h2 id="split-h">How each payday is split</h2><span class="chip"><i></i>Plan ${activePlan()} is active</span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Bucket</th><th>Kept in</th><th class="r">Plan A</th><th class="r">Plan B</th><th>What it's for</th></tr></thead>
          <tbody>${BUCKETS.filter((b) => !b.planless).map((b) => `<tr style="--c:${col(b.id)}"><td><span class="bn"><i></i>${b.name}</span><small class="m-only"><label class="sr" for="kept-m-${b.id}">${b.name} is kept in</label><select class="mini" id="kept-m-${b.id}" data-kept="${b.id}">${acctNames().map((a) => `<option value="${esc(a)}" ${a === b.acct ? "selected" : ""}>${esc(a)}</option>`).join("")}</select> ${b.note}</small></td>
            <td><label class="sr" for="kept-${b.id}">${b.name} is kept in</label><select class="mini" id="kept-${b.id}" data-kept="${b.id}">${acctNames().map((a) => `<option value="${esc(a)}" ${a === b.acct ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></td>
            <td class="r"><label class="sr" for="pa-${b.id}">${b.name} Plan A percent</label><input type="number" min="0" max="100" step="1" id="pa-${b.id}" data-plan="A" data-b="${b.id}" value="${state.plan.A[b.id]}"></td>
            <td class="r"><label class="sr" for="pb-${b.id}">${b.name} Plan B percent</label><input type="number" min="0" max="100" step="1" id="pb-${b.id}" data-plan="B" data-b="${b.id}" value="${state.plan.B[b.id]}"></td>
            <td class="muted">${b.note}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td></td><td class="r ${tA === 100 ? "total-ok" : "total-bad"}">${tA}%</td><td class="r ${tB === 100 ? "total-ok" : "total-bad"}">${tB}%</td><td></td></tr></tfoot>
        </table></div>
        <p class="plan-msg" style="color:${ok ? "var(--ink-2)" : "var(--warm)"}">${msg}</p>
        ${BUCKETS.filter((b) => b.planless && isOn(b.id)).map((b) => `<p class="planless-ln" style="--c:${col(b.id)}"><span class="bn"><i></i>${b.name}</span> isn't part of the split. It's kept in <label class="sr" for="kept-${b.id}">${b.name} is kept in</label><select class="mini" id="kept-${b.id}" data-kept="${b.id}">${acctNames().map((a) => `<option value="${esc(a)}" ${a === b.acct ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></p>`).join("")}
      </section>
      <section class="card" aria-labelledby="rules-h">
        <h2 id="rules-h" style="margin-bottom:12px">Rules</h2>

  /* Suggested plan: needs first (bills, then living), then the priority's profile, then set-asides; trimmed to 100 from the most flexible buckets. */
  function suggestPlan(preset) {
    const inp = obInputs();

    const billsPct = inp.bills > 0 && inp.monthly > 0 ? Math.min(45, Math.ceil((inp.bills * 100) / inp.monthly)) : 0;

    p.buffer = inp.foreign ? 3 : inp.varies ? 5 : 0;

    for (const [k, min] of [["fun", 5], ["sinking", 5], ["invest", 0], ["emergency", 5], ["living", 10], ["fun", 0], ["sinking", 0], ["emergency", 0]]) {

  function obSplit(amount, p) {

      + (spent ? ["living", "fun"].filter((id) => spent[id] && p[id] > 0).map((id) => { const m = mo[id], short = m < spent[id]; return `<li class="${short ? "warn" : ""}"><span class="dotc" style="--c:${col(id)}"></span><span>${fName(id)} gets about <b>${whole(m)}</b> a month. Last month you spent <b>${whole(spent[id])}</b> on its categories.${short ? " Consider a bigger share." : " Room to spare."}</span></li>`; }).join("") : "");
    return `<form class="card ob-card ob-plan" id="ob-form" novalidate>
      ${H(ob.planOnly ? "Make a plan" : `Step ${ob.path === "app" ? 4 : 4} · Your plan`, `Here's a plan for your ${whole(inp.amount)} pay`, `Built from your answers: ${why.join(", ")}. Change any share; it's yours.`)}
      <div class="seg ob-seg" role="group" aria-label="Start from">${[["suggested", 'Suggested<span class="m-hide"> for you</span>'], ["503020", "50/30/20"], ["simple", "Simple"]].map(([k, l]) => `<button class="seg-b" type="button" data-ob="preset" data-preset="${k}" aria-pressed="${ob.preset === k}">${l}</button>`).join("")}</div>
      <div class="ob-bar" aria-hidden="true">${PLAN_IDS.filter((id) => p[id] > 0).map((id) => `<span style="--c:${col(id)};flex-grow:${p[id]}">${p[id] >= 8 ? `${p[id]}%` : ""}</span>`).join("")}</div>
      <div class="ob-rows" role="list">${shown.map((id) => `<div class="ob-prow ${p[id] ? "" : "off"}" role="listitem" style="--c:${col(id)}">
          <span class="ob-pn"><i></i><span><b>${fName(id)}</b><small>${id === "sinking" && ob.prio === "goal" && ob.goalName ? `Saving for ${esc(clean(ob.goalName))}, plus gadgets and gifts.` : PURPOSE[id]}</small></span></span>
          <span class="ob-step"><button type="button" class="ob-sb" id="obd-${id}-m" data-ob="pct" data-b="${id}" data-d="-1" aria-label="Less to ${fName(id)}" ${p[id] <= 0 ? "disabled" : ""}>−</button><label class="sr" for="obp-${id}">${fName(id)} percent</label><input id="obp-${id}" data-obpct="${id}" type="number" min="0" max="100" step="1" value="${p[id]}"><span class="pc">%</span><button type="button" class="ob-sb" id="obd-${id}-p" data-ob="pct" data-b="${id}" data-d="1" aria-label="More to ${fName(id)}" ${p[id] >= 100 ? "disabled" : ""}>+</button></span>
          <span class="ob-pv num">${peso(al[id] || 0)}<small>${ob.billsLater && id === "rent" ? `to Emergency until ${shortD(ob.billsStart)}` : `≈ ${whole(mo[id] || 0)} a month`}</small></span>
        </div>`).join("")}</div>
      ${hidden.length ? `<p class="ob-more">Add a bucket: ${hidden.map((id) => `<button class="btn btn-quiet rm" type="button" data-ob="addb" data-b="${id}">+ ${fName(id)}</button>`).join(" ")}</p>` : ""}
      <div class="ob-total ${t === 100 ? "ok" : "bad"}" id="ob-total" aria-live="polite">${t === 100 ? `${I.check}<b>100%</b> Every peso of this pay has a job.` : `<b>${t}%</b> ${t > 100 ? `Take ${t - 100}% from a bucket.` : `${100 - t}% still needs a job.`}`}</div>
      ${checks ? `<ul class="ob-reality" aria-label="Compared with your spending">${checks}</ul>` : ""}
      ${switchHTML(p)}
      ${navHTML("Use this plan", { disabled: t !== 100 })}
    </form>`;
  }

  function switchHTML(p) {
    return `<div class="ob-switch-wrap">${canSwitch() ? `<div class="ob-switch"><label class="ob-toggle"><input type="checkbox" id="ob-switch" ${ob.switchOn ? "checked" : ""}><span class="sw"></span><span><b>Switch to Plan B when your safety net is full</b><small>Then Emergency drops to 5% and Investments get the other ${p.emergency - 5}%.</small></span></label>

  }

      <div class="ob-preview">

          ${tr.keep.amt ? `<div class="move stays"><span class="box">${I.check}</span><span class="move-t"><b>Keep ${peso(tr.keep.amt)} in ${esc(ob.landed)}</b><small>${tr.keep.names.join(", ")} · already there</small></span><span></span><span class="v">${fmt(tr.keep.amt)}</span></div>` : ""}
          ${tr.moves.map((m) => `<div class="move ob-pmove"><span class="ob-arrow">${I.arrow}</span><span class="move-t"><b>Send ${peso(m.amt)} to ${esc(m.to)}</b><small>${m.names.join(", ")}</small></span><span></span><span class="v">${fmt(m.amt)}</span></div>`).join("")}

  function catsObHTML(H) {

      ${unsure.length ? `<div class="ob-unsure">${unsure.map((c) => `<div class="ob-cat"><span><b>${esc(c.name)}</b><small>${c.spent ? `${whole(c.spent)} last month` : "Nothing last month"}</small></span><label class="sr" for="obc-${c.id}">Bucket for ${esc(c.name)}</label><select id="obc-${c.id}" data-obcat="${c.id}">${opts(c)}</select></div>`).join("")}</div>` : ""}
      <div class="ob-catgroups">${on.map((id) => { const cs = ob.cats.filter((c) => c.b === id && c.sure); return cs.length ? `<div class="ob-cg" style="--c:${col(id)}"><span class="bn"><i></i>${fName(id)}</span><span class="ob-pills">${cs.map((c) => `<span class="ob-pill">${esc(c.name)}</span>`).join("")}</span></div>` : ""; }).join("")}</div>

  function firstHTML(H) {
    const f = ob.first, m = mainIncome(), amount = ob.path === "app" ? m.amount : parseMoney(f.amount) || 0;

        ${(() => { const w = appWaiting(false); if (!w.length) return ""; const tot = w.reduce((a, x) => a + x.seen[0][1], 0); const how = (x) => x.rule === "ask" ? "you'll pick its job" : x.rule === "whole" ? (x.kind === "scholarship" ? "kept whole in Scholarship" : "kept whole") : x.rule === "own" ? "its own split" : "split by your plan"; return `<p class="ob-note">${I.info}<span>${whole(tot)} from ${w.length} more income${w.length > 1 ? "s" : ""} is in Money in too: ${w.map((x) => `${esc(x.name)} (${how(x)})`).join(" and ")}.</span></p>`; })()}
        <div class="ob-nav"><button class="btn btn-quiet" type="button" data-ob="back">Back</button><button class="btn btn-quiet" type="button" data-ob="later">Do it later</button><button class="btn btn-primary" type="button" data-ob="split">Give it a job ${I.arrow}</button></div>
      </div>`;
      return `<div class="card ob-card">
        ${H("Last step · First pay", "Has money come in since your last payday?", "Give it a job now and you'll see your plan work on real money. It takes a minute.")}
        <div class="ob-cards ob-cards-2">
          <button class="ob-opt big as-btn" type="button" data-ob="have"><span class="ob-opt-b"><b>Yes, I'll add it</b><small>Enter what landed. Salin splits it by your plan.</small></span></button>
          <button class="ob-opt big as-btn" type="button" data-ob="later"><span class="ob-opt-b"><b>Not yet</b><small>Add it on payday. We'll remind you.</small></span></button>
        </div>
        <div class="ob-nav"><button class="btn btn-quiet" type="button" data-ob="back">Back</button></div>
      </div>`;
    }
    if (f.stage === "add") return `<form class="card ob-card" id="ob-form" novalidate>
      ${H("Last step · First pay", "What came in?", "")}
      <div class="ob-row2">
        <label class="fld"><span>Amount received</span><span class="money"><i>₱</i><input id="ob-famt" inputmode="decimal" autocomplete="off" value="${esc(f.amount)}" placeholder="0.00"></span></label>
        <label class="fld"><span>Date</span><input id="ob-fdate" type="date" max="${TODAY}" value="${f.date}"></label>
      </div>
      <p class="ob-note">${I.info}<span>From ${esc(m.name)}, landed in ${esc(ob.landed)}. Change accounts later in Plans.</span></p>
      ${navHTML("Give it a job")}

    if (f.stage === "later") return `<form class="card ob-card" id="ob-form" novalidate>
      ${H("Last step · First pay", "That's fine. Payday is the moment.", `On ${dayLabel(m.next)}, add your pay${ob.path === "app" ? " here or in the app" : ""} and Salin splits it by your plan in one tap. Then you'll tick off the transfers.`)}
      <fieldset class="ob-fs"><legend>Remind me</legend>
        <div class="ob-chips"><label class="ob-chip"><input type="radio" name="ob-remind" value="email" checked><span>Email me on payday</span></label><label class="ob-chip"><input type="radio" name="ob-remind" value="none"><span>No reminder</span></label></div>
      </fieldset>
      ${navHTML("Open Today")}
    </form>`;
    const al = obSplit(amount, ob.plan), tr = homesTransfers(amount);
    const total = tr.moves.length, sentN = tr.moves.filter((x) => f.sent[x.to] === x.amt).length;
    const allSent = sentN === total;
    if (f.stage === "split") return `<div class="card ob-card">
      ${H("Last step · First pay", `${peso(amount)} from ${esc(m.name)}, split by your plan`, "Check it, then confirm. This is the same split every payday will use.")}
      <div class="bars ob-bars" aria-label="Where it goes">${PLAN_IDS.filter((id) => al[id] > 0).map((id, i) => `<div class="bar-row" style="--c:${col(id)};--d:${i * 60}ms"><span class="n"><i></i>${bName(id)}</span><span class="track"><i style="transform:scaleX(${(al[id] / amount).toFixed(3)})"></i></span><span class="v">${fmt(al[id])}</span></div>`).join("")}</div>
      ${ob.billsLater && !ob.skipped && ob.plan.rent ? `<p class="ob-note">${I.info}<span>${billName()}'s ${ob.plan.rent}% goes to your Emergency fund until ${longDate(ob.billsStart)}.</span></p>` : ""}
      <div class="ob-nav"><button class="btn btn-quiet" type="button" data-ob="back-first">Back</button><button class="btn btn-primary" type="button" data-ob="confirm">Confirm split ${I.arrow}</button></div>
    </div>`;
    if (f.stage === "moves" && !allSent) return `<div class="card ob-card">
      ${H("Last step · First pay", "Now move the money", "Open your banking app, send each one, then tick it here. Your accounts will match your buckets.")}
      <div class="moves">
        ${tr.keep.amt ? `<div class="move stays"><span class="box">${I.check}</span><span class="move-t"><b>Keep ${peso(tr.keep.amt)} in ${esc(ob.path === "app" ? m.landed : ob.landed)}</b><small>${tr.keep.names.join(", ")} · already there</small></span><span></span><span class="v">${fmt(tr.keep.amt)}</span></div>` : ""}
        ${tr.moves.map((x) => { const done = f.sent[x.to] === x.amt; return `<label class="move ${done ? "is-done" : ""}"><input type="checkbox" data-obmove="${esc(x.to)}" data-amt="${x.amt}" ${done ? "checked" : ""}><span class="box">${I.check}</span><span class="move-t"><b>Send ${peso(x.amt)} to ${esc(x.to)}</b><small>${x.names.join(", ")}</small></span><span class="stamp">Sent</span><span class="v">${fmt(x.amt)}</span></label>`; }).join("")}
      </div>
      <p class="ob-tcount">${sentN} of ${total} sent</p>
      <div class="ob-nav"><button class="btn btn-quiet" type="button" data-ob="finish-open">I'll send them later</button></div>
    </div>`;
    const bucketsN = PLAN_IDS.filter((id) => al[id] > 0).length;
    return `<section class="card peak ob-peak enter" aria-labelledby="ob-peak-h" role="status">
      <h2 id="ob-peak-h" tabindex="-1">Every peso has a home.</h2>
      <ul>
        <li><span class="ck">${I.check}</span>${peso(amount)} split into ${bucketsN} bucket${bucketsN > 1 ? "s" : ""}</li>
        ${total ? `<li><span class="ck">${I.check}</span>Your accounts match your plan</li>` : `<li><span class="ck">${I.check}</span>Everything stays where it landed</li>`}
        <li><span class="ck">${I.check}</span>Safe to spend until ${shortD(m.next)}: ${peso((al.living || 0) + (al.fun || 0) - preSpend(["living", "fun"]))}${preSpend(["living", "fun"]) ? ", after what you've already spent" : ""}</li>
        ${(al.emergency || 0) > 0 ? `<li><span class="ck sun">${I.spark}</span>Your Emergency fund has started: ${peso(al.emergency)}</li>` : ""}
      </ul>
      <div class="row"><button class="btn btn-primary" type="button" data-ob="finish">Open Today ${I.arrow}</button></div>
    </section>`;
  }

  /* The plan slip: each answer prints a line; unanswered lines wait as dotted placeholders. */
  function slipObHTML() {
    const live = ob.path && (ob.path !== "app" || ob.synced);
    const inp = obInputs(), m = live ? mainIncome() : null, A = live ? obAccts() : [];
    const L = [];
    const ln = (key, label, val) => { const has = val !== null && val !== undefined && val !== ""; const fresh = has && !ob.seen.has(key); if (has) ob.seen.add(key); L.push(`<div class="r-ln ${has ? (fresh ? "fresh" : "") : "todo"}"><span>${label}</span><span class="d"></span><span>${has ? val : "· · ·"}</span></div>`); };
    ln("name", "For", ob.name && live ? esc(clean(ob.name)) : "");
    ln("in", "Comes in", m && m.amount ? `${fmt(m.amount)}` : "");
    ln("freq", "How often", m && m.amount ? FREQ_TXT[m.freq] : "");
    ln("next", "Next payday", m && m.next ? shortD(m.next) : "");
    ln("acct", "Accounts", A.length && (ob.path === "app" ? ob.synced : ob.picks.length) ? `${A.length}` : "");
    ln("land", "Lands in", ob.landed && live ? esc(ob.landed) : "");
    ln("prio", "First", ob.prio ? PRIO_SHORT[ob.prio] : ob.skipped ? "Just tracking" : "");
    const planReady = ob.plan && steps().indexOf("plan") > -1 && ob.i >= steps().indexOf("plan");
    let split = "";
    if (planReady || ob.skipped) {
      const p = ob.plan, al = obSplit(inp.amount, p);
      split = `<div class="r-rule"></div>${PLAN_IDS.filter((id) => p[id] > 0).map((id) => { const k = `pl-${id}`; const fresh = !ob.seen.has(k); ob.seen.add(k); return `<div class="r-ln ${fresh ? "fresh" : ""}" style="--c:${col(id)}"><i class="dotc"></i><span>${bName(id)}</span><span class="d"></span><span class="p">${p[id]}%</span><span style="min-width:74px;text-align:right">${fmt(al[id] || 0)}</span></div>`; }).join("")}<div class="r-rule"></div><div class="r-ln total"><span>Total</span><span class="d"></span><span>${planTotal(p)}%</span></div>`;
    } else split = `<div class="r-rule"></div><div class="r-ln todo"><span>Your split</span><span class="d"></span><span>· · ·</span></div>`;
    const homesReady = ob.homes && ob.i >= steps().indexOf("homes") && steps().indexOf("homes") > -1;
    const tr = homesReady && inp.amount ? homesTransfers(inp.amount).moves.length : null;
    const done = !ob.planOnly && ob.first.stage === "done";
    return `<div class="receipt-shadow ob-slip-wrap"><div class="receipt ob-slip">
      <img class="r-logo" src="${LOGO}" alt="">
      <div class="r-title">Plan slip</div>
      <div class="r-meta">Sun Oct 11 2026 · ${done ? "set" : "being set up"}</div>
      <div class="r-rule"></div>
      ${L.join("")}
      ${split}
      <div class="r-ln ${tr === null ? "todo" : ""}"><span>On payday</span><span class="d"></span><span>${tr === null ? "· · ·" : tr ? `${tr} transfer${tr > 1 ? "s" : ""}` : "no transfers"}</span></div>
      <p class="r-foot">${ob.billsLater && !ob.skipped && ob.plan && ob.plan.rent && (planReady) ? `${billName()}'s share goes to Emergency until ${shortD(ob.billsStart)}. ` : ""}${done ? "Set. Every payday from here uses this plan." : "Fills in as you answer. Nothing is saved until you finish."}</p>
      <div class="bigstamp ${done ? "on" : ""}" aria-hidden="true">PLAN SET<small>OCT 11</small></div>
    </div></div>`;
  }

  /* ---------- Apply to the app ---------- */
  function obApply(opts = {}) {
    const p = { ...Object.fromEntries(PLAN_IDS.map((id) => [id, 0])), ...ob.plan };
    const inp = obInputs(), m = mainIncome();
    const nm = clean(ob.name) || "there";
    state.user = { name: nm, initials: nm.slice(0, 2).toUpperCase() };
    state.plan = { A: { ...p, dost: 0 }, B: { ...(ob.switchOn && canSwitch() ? planB(p) : p), dost: 0 } };
    state.switchOn = !ob.skipped && ob.switchOn && canSwitch();
    state.rentRule = ob.billsLater && !ob.skipped && p.rent ? { until: ob.billsStart } : null;
    state.livingBase = p.living;
    EMERGENCY_TARGET = ob.target || suggestTarget(p);
    BY.rent.name = billName(); BY.rent.short = billName(); BY.rent.note = PURPOSE.rent;
    BY.living.name = ob.skipped ? "Spending" : "Living"; BY.living.short = ob.skipped ? "Spending" : "Living";
    PLAN_IDS.forEach((id) => { if (id !== "rent") BY[id].note = PURPOSE[id]; });
    if (ob.path === "app") BY.dost.note = "Scholarship money (your DOST stipend), kept whole.";
    const landed = ob.path === "app" ? m.landed : ob.landed;
    BUCKETS.forEach((b) => { b.acct = ob.skipped ? landed : (ob.homes && ob.homes[b.id]) || landed; });
    state.firstStep = ob.skipped ? { id: "plan", t: "Make a plan", done: false } : { id: "setup", t: "Plan set up", done: true };
    /* goals: keep what's there, update the Emergency target, add the named goal once */
    if (ob.skipped) state.goals = opts.planOnly ? state.goals : [];
    else {
      if (!opts.planOnly) state.goals = [];
      const em = state.goals.find((g) => g.id === "em");
      if (em) em.target = EMERGENCY_TARGET;
      else state.goals.unshift({ id: "em", name: "Emergency fund", target: EMERGENCY_TARGET, from: state.switchOn ? "Emergency fund bucket, switches to Plan B" : "Emergency fund bucket" });
      const gn = clean(ob.goalName);
      if (ob.prio === "goal" && gn && !state.goals.some((g) => g.name.toLowerCase() === gn.toLowerCase())) state.goals.push({ id: "g" + Date.now(), name: gn, target: parseMoney(ob.goalAmt), from: "Sinking funds", feed: { b: "sinking", share: 100 } });
    }
    const billCats = () => (p.rent > 0 ? (ob.billKinds.length ? ob.billKinds : ["Bills"]) : []).map((n, i) => ({ id: "bill" + i, name: n, b: "rent", auto: true }));
    if (opts.planOnly) {
      /* only categories that were placed automatically, or sit in a bucket that's now off, move */
      if (ob.path === "app" && ob.cats) state.cats.forEach((c) => { const o = ob.cats.find((x) => x.id === c.id); if (o && (c.auto !== false)) c.b = o.b; });
      else state.cats.forEach((c) => { if (c.auto !== false) c.b = autoMap(c.name).b; });
      state.cats.forEach((c) => { if (!isOn(c.b) && !(p[c.b] > 0)) c.b = "living"; });
      billCats().forEach((bc) => { if (!state.cats.some((c) => c.name.toLowerCase() === bc.name.toLowerCase())) state.cats.push(bc); });
      state.pendingPrint = null;
      return;
    }
    state.mode = ob.path === "app" ? "app" : "new";
    state.nextPay = m.next;
    state.accounts = obAccts().map((a) => ({ name: a.name, type: a.type, cur: a.cur || "PHP", aud: 0, sample: ob.path === "app" }));
    let mainSrc;
