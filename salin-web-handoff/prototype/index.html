    if (again) {
      state.logDraft = { amount: "", what: "", cat: d.cat, acct: d.acct, date: d.date, err: "" };
      $("#logsheet").innerHTML = logHTML(); $("#log-amt").focus();
      if (state.view === "today") renderToday();
      return;
    }
    closeLog();
    render();
    const ob1 = $("[data-act=log-open]"); if (ob1) ob1.focus();
    const fl = $("#flash"); if (fl && !reduce()) fl.animate([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 240, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
  });
  document.addEventListener("keydown", (e) => {
    if (!state.logOpen) return;
    if (e.key === "Escape") { closeLog(); return; }
    if (e.key === "Tab") {
      const f = $$("#logsheet button, #logsheet input, #logsheet select").filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });


  /* ---------- Shell ---------- */
  function renderTabs() {
    document.body.classList.toggle("is-ob", state.view === "welcome");
    $(".avatar").textContent = state.user.initials;
    $(".avatar").setAttribute("aria-label", state.user.name);
    $(".foot-note").hidden = state.view === "welcome" || state.mode === "new";
    if (state.mode === "app") $(".foot-note").innerHTML = 'Prototype. Accounts, categories, income and spending marked <span class="sample">Sample</span> stand in for what your Salin app would sync.';
    $$(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.go === state.view)));
    $$(".view").forEach((v) => (v.hidden = v.id !== state.view));
    $("#dot-payday").hidden = !(state.inbox.length || pendingMoves());
    const dr = $("#dot-review");
    dr.hidden = false;
    dr.className = "dot" + (state.weekClosed ? " good" : "");
    dr.setAttribute("aria-label", state.weekClosed ? "closed" : "due");
    const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    $("#theme").innerHTML = dark ? I.sun : I.moon;
  }
  function render() {
    renderTabs();
    if (state.view === "today") renderToday();
    if (state.view === "payday") renderPayday();
    if (state.view === "review") renderReview();
    if (state.view === "plans") renderPlans();
    if (state.view === "welcome") renderWelcome();
    if (state.view === "today" && state.pendingPrint) {
      const prev = state.pendingPrint; state.pendingPrint = null;
      requestAnimationFrame(() => playGrow(prev));
    }
  }
  function go(view) {
    if (!["today", "payday", "review", "plans", "welcome"].includes(view)) return;
    state.view = view;
    state.flash = null;
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function cover() {
    const need = -left("living"); if (need <= 0) return;
    state.covers.push({ from: "buffer", to: "living", amt: need });
    say(`Covered ${peso(need)} from Buffer. Living is back to zero.`);
    closeDrawer(); render();
  }
  function confirmItems(ids) {
    const items = state.inbox.filter((i) => ids.includes(i.id));
    if (!items.length) return;
    if (!state.pendingPrint) { state.wasOver = overspent(); state.pendingPrint = { lefts: lefts(), safe: safe(), sinkIn: inOf("sinking"), ins: Object.fromEntries(BUCKETS.map((b) => [b.id, inOf(b.id)])), pend: {} }; }
    items.forEach((it) => {
      const src = SRC(it.src);
      const alloc = allocFor(it);
      const label = howLabel(it);
      const before = left("emergency") / EMERGENCY_TARGET;
      const dest = destOf(alloc);
      state.paydays.push({ date: it.date, source: src.name, amount: it.amount, alloc, dest });
      Object.entries(alloc).forEach(([k, v]) => (state.pendingPrint.pend[k] = (state.pendingPrint.pend[k] || 0) + v));
      const after = left("emergency") / EMERGENCY_TARGET;
      const crossed = MILESTONES.filter((m) => before < m && after >= m);
      if (crossed.length) state.milestone = Math.max(state.milestone || 0, crossed[crossed.length - 1]);
      state.done.push({ id: it.id, date: it.date, name: src.name, kind: src.kind, amount: it.amount, alloc, dest, landed: it.landed || src.landed, how: label });
    });
    state.inbox = state.inbox.filter((i) => !ids.includes(i.id));
    state.sel = state.inbox.length ? state.inbox[0].id : null;
    renderTabs(); renderPayday();
    const nm = pendingMoves();
    say(`Confirmed ${items.length}. ${state.inbox.length ? state.inbox.length + " still waiting." : nm ? nm + " transfers to make." : "All done."}`);
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-go],[data-act],[data-open],[data-plantab]");
    if (!t) return;
    if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
    if (t.dataset.open) { openDrawer(t.dataset.open); return; }
    const a = t.dataset.act;
    if (a === "cover") cover();
    if (t.dataset.plantab) { state.planTab = t.dataset.plantab; renderPlans(); const b = $(`[data-plantab="${state.planTab}"]`); if (b) b.focus(); return; }
    if (a === "add-acct") { state.addAcct = true; renderPlans(); $("#na-name").focus(); }
    if (a === "cancel-acct") { state.addAcct = false; renderPlans(); $("[data-act=add-acct]").focus(); }
    if (a === "archive-acct") { const x = state.accounts.find((y) => y.name === t.dataset.name); x.archived = true; renderPlans(); const f = $("[data-act=add-acct]"); if (f) f.focus(); say(`${x.name} archived.`); }
    if (a === "restore-acct") { const x = state.accounts.find((y) => y.name === t.dataset.name); x.archived = false; renderPlans(); const rf = $(`[data-acctname="${CSS.escape(x.name)}"]`); if (rf) rf.focus(); say(`${x.name} restored.`); }
    if (a === "rm-cat") { const c = state.cats.find((y) => y.id === t.dataset.id); state.cats = state.cats.filter((y) => y.id !== t.dataset.id); renderPlans(); const f = document.getElementById("ca-" + c.b); if (f) f.focus(); say(`${c.name} removed.`); }
    if (a === "add-income") { state.addIncome = true; state.draft.err = ""; if (state.view !== "payday") go("payday"); else renderPayday(); const f = $("#inc-amt"); if (f) f.focus(); }
    if (a === "cancel-income") { state.addIncome = false; state.draft = { src: "work", amount: "", date: "2026-10-11", landed: "", aud: "", err: "" }; renderPayday(); const f = $("[data-act=add-income]"); if (f) f.focus(); }
    if (a === "confirm-all") { confirmItems(ready().map((i) => i.id)); const f = state.inbox.length ? $("[data-act=sel]") : $("input[data-move]") || $("#s2") || $(".peak .btn"); if (f) f.focus(); }
    if (a === "confirm-one") { confirmItems([t.dataset.id]); const f = $("[data-act=sel]") || $("input[data-move]"); if (f) f.focus(); }
    if (a === "sel") { const cur = $(".inq-item.open [data-act=sel]"); state.sel = cur && cur.dataset.id === t.dataset.id ? null : t.dataset.id; renderPayday(); const b = $(`[data-act=sel][data-id="${t.dataset.id}"]`); if (b) b.focus(); }
    if (a === "rm-src") { const x = SRC(t.dataset.id); state.sources = state.sources.filter((y) => y.id !== t.dataset.id); renderPlans(); const f = $("[data-act=open-add]"); if (f) f.focus(); say(`${x.name} removed.`); }
    if (a === "open-add") { state.addOpen = true; renderPlans(); const f = $(".preset"); if (f) f.focus(); }
    if (a === "add-src") {
      const k = t.dataset.kind, d = KINDS[k];
      const id = "s" + (state.sources.length + 1);
      state.sources.push({ id, name: d.label, kind: k, rule: d.rule, bucket: d.bucket, own: d.own ? { ...d.own } : undefined, landed: acctNames().includes("GCash / cash") ? "GCash / cash" : acctNames()[0], isNew: true });
      state.addOpen = false; renderPlans();
      const f = document.getElementById("nm-" + id); if (f) { f.focus(); f.select(); }
      say(`${d.label} added. It starts with: ${ruleLabel(SRC(id))}.`);
    }
    if (a === "close-drawer") closeDrawer();
    if (a === "close") { state.weekClosed = true; state.burst = "week"; renderTabs(); renderReview(); say("Week closed. Next review Sunday, October 18."); }
    if (a === "switch-on") { state.switchOn = true; renderPlans(); const f = $("#em-target"); if (f) f.focus(); say("Plan B is on. It starts when your Emergency fund reaches the amount shown."); return; }
    if (a === "raise") { if ((state.plan.A.fun || 0) < 1) { say("Fun money is already at 0%. Change the split in Plans."); return; } ["A", "B"].forEach((k) => { state.plan[k].living += 1; state.plan[k].fun -= 1; }); renderReview(); say(`Living now gets ${state.plan.A.living}% of each payday, from your next payday.`); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.kept) { BY[t.dataset.kept].acct = t.value; const id = t.id; renderPlans(); document.getElementById(id).focus(); say(`${BY[t.dataset.kept].name} is now kept in ${t.value}, from your next payday.`); }
    if (t.dataset.accttype) { state.accounts.find((a) => a.name === t.dataset.accttype).type = t.value; }
    if (t.dataset.acctname) {
      const oldN = t.dataset.acctname, newN = clean(t.value);
      if (!newN || (newN !== oldN && state.accounts.some((a) => a.name.toLowerCase() === newN.toLowerCase()))) { t.value = oldN; say(newN ? "That name is already used." : "An account needs a name."); return; }
      if (newN !== oldN) { state.accounts.find((a) => a.name === oldN).name = newN; renameAccount(oldN, newN); const id = t.id; renderPlans(); document.getElementById(id).focus(); say(`Renamed to ${newN}. Buckets and sources follow.`); }
    }
    if (t.dataset.catname) { const c = state.cats.find((y) => y.id === t.dataset.catname); c.name = clean(t.value) || c.name; t.value = c.name; }
    if (t.dataset.catmove) { const c = state.cats.find((y) => y.id === t.dataset.catmove); c.b = t.value; c.auto = false; renderPlans(); const f = document.getElementById("cm-" + c.id); if (f) f.focus(); say(`${c.name} now goes to ${BY[c.b].name} for new spending.`); }
    if (t.id === "em-target" || t.dataset.goal) {
      const v = parseMoney(t.value);
      if (t.id === "em-target" && !G("em")) state.goals.unshift({ id: "em", name: "Emergency fund", target: EMERGENCY_TARGET, from: "Emergency fund bucket, switches to Plan B" });
      const g = t.id === "em-target" ? G("em") : G(t.dataset.goal);
      if (v > 0) { g.target = v; if (g.id === "em") EMERGENCY_TARGET = v; say(`${g.name} target is now ${whole(v)}.`); } else say("Enter a target above \u20b10. The old target is kept.");
      const id = t.id; renderPlans(); const f = document.getElementById(id); if (f) f.focus();
    }
    if (t.id === "inc-src") { state.draft.src = t.value; state.draft.landed = ""; renderPayday(); $("#inc-src").focus(); }
    if (t.id === "inc-land") state.draft.landed = t.value;
    if (t.name === "how") { const it = state.inbox.find((i) => i.id === t.dataset.item); if (it) { it.how = t.value; renderPayday(); const r = $(`input[name=how][value=${t.value}]`); if (r) r.focus(); } }
    if (t.id === "one-b") { const it = state.inbox.find((i) => i.id === t.dataset.item); if (it) { it.one = t.value; renderPayday(); $("#one-b").focus(); } }
    if (t.dataset.src) {
      const x = SRC(t.dataset.src); x.rule = t.value;
      if (x.rule === "whole" && !x.bucket) x.bucket = "living";
      if (x.rule === "own" && !x.own) x.own = { ...KINDS.side.own };
      state.inbox.forEach((i) => { if (i.src === x.id) i.how = undefined; });
      const id = t.id; renderPlans(); const f = document.getElementById(id); if (f) f.focus();
      say(`${x.name}: ${ruleLabel(x)}.`);
    }
    if (t.dataset.srcbucket) { const x = SRC(t.dataset.srcbucket); x.bucket = t.value; const id = t.id; renderPlans(); const f = document.getElementById(id); if (f) f.focus(); }
    if (t.dataset.srcname) { const x = SRC(t.dataset.srcname); x.name = clean(t.value) || KINDS[x.kind].label; t.value = x.name; }
    if (t.dataset.srcland) { const x = SRC(t.dataset.srcland); x.landed = t.value; const id = t.id; renderPlans(); const f = document.getElementById(id); if (f) f.focus(); }
    if (t.dataset.own) {
      const x = SRC(t.dataset.own); x.own[t.dataset.b] = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0)));
      const id = t.id; renderPlans(); const f = document.getElementById(id); if (f) f.focus();
    }
    if (t.dataset.move) {
      state.moves[t.dataset.move] = t.checked ? Number(t.dataset.amt) : 0;
      const acct = t.dataset.move;
      const leftN = pendingMoves();
      if (!leftN) state.burst = "payday";
      renderTabs(); renderPayday();
      const again = $(`input[data-move="${CSS.escape(acct)}"]`); if (again) again.focus();
      else { const b = $(".peak .btn"); if (b) b.focus(); }
      say(t.checked ? (leftN ? `Sent. ${leftN} to go.` : "Payday done. Your accounts match your buckets.") : "Unticked.");
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id === "acct-form") {
      e.preventDefault();
      const name = clean($("#na-name").value);
      const err = (m) => { $("#na-err").textContent = m; $("#na-name").focus(); };
      if (!name) return err("Give the account a name.");
      if (state.accounts.some((a) => a.name.toLowerCase() === name.toLowerCase())) return err("You already have an account with that name.");
      state.accounts.push({ name, type: $("#na-type").value, cur: $("#na-cur").value, aud: 0 });
      state.addAcct = false; renderPlans(); const f = $(`[data-acctname="${CSS.escape(name)}"]`); if (f) f.focus(); say(`${name} added.`);
      return;
    }
    if (e.target.dataset.catadd) {
      e.preventDefault();
      const bid = e.target.dataset.catadd, inp = $("#ca-" + bid), name = clean(inp.value);
      if (!name) { inp.focus(); return; }
      const id = "c" + Date.now();
      state.cats.push({ id, name, b: bid });
      renderPlans(); const f = document.getElementById("ca-" + bid); if (f) f.focus(); say(`${name} added to ${BY[bid].name}.`);
      return;
    }
    if (e.target.id !== "inc-form") return;
    e.preventDefault();
    const d = state.draft, src = SRC(d.src);
    const cents = parseMoney(d.amount), aud = d.aud ? parseMoney(d.aud) : 0;
    if (!(cents > 0)) { d.err = "Enter the amount you received, above \u20b10."; renderPayday(); $("#inc-amt").focus(); return; }
    if (cents > 1000000000) { d.err = "That amount looks too large. Check the number of zeros."; renderPayday(); $("#inc-amt").focus(); return; }
    if (d.aud && !(aud > 0)) { d.err = "The A$ amount isn't a number. Fix it or leave it empty."; renderPayday(); $("#inc-aud").focus(); return; }
    const it = { id: "in" + Date.now(), src: src.id, date: shortDate(d.date || "2026-10-11"), amount: cents, landed: d.landed || src.landed, aud: aud || 0 };
    state.inbox.push(it);
    state.sel = it.id;
    state.addIncome = false;
    state.draft = { src: d.src, amount: "", date: "2026-10-11", landed: "", aud: "", err: "" };
    renderTabs(); renderPayday();
    const row = $(`[data-act=sel][data-id="${it.id}"]`); if (row) row.focus();
    say(`Added ${peso(cents)} from ${src.name}. ${howOf(it) ? "Its job: " + howLabel(it) + "." : "It needs a job."}`);
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "inc-amt" || t.id === "inc-aud") { const er = $("#inc-err"); if (er && er.textContent) { er.textContent = ""; state.draft.err = ""; } }
    if (t.id === "inc-amt") { state.draft.amount = t.value.replace(/[<>"`]/g, ""); state.draft.err = ""; const r = $("#inc-rate"); const c = parseMoney(t.value), a = parseMoney(state.draft.aud); if (r && c > 0 && a > 0) r.textContent = `Rate you got: \u20b1${(c / a).toFixed(2)} per A$1`; }
    if (t.id === "inc-aud") { state.draft.aud = t.value.replace(/[<>"`]/g, ""); const r = $("#inc-rate"); const c = parseMoney(state.draft.amount), a = parseMoney(t.value); if (r) r.textContent = c > 0 && a > 0 ? `Rate you got: \u20b1${(c / a).toFixed(2)} per A$1` : "Add the A$ amount to track the rate you got."; }
    if (t.id === "inc-date") state.draft.date = t.value;
    if (t.dataset.plan) {
      state.plan[t.dataset.plan][t.dataset.b] = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0)));
      const id = t.id; renderPlans();
      const again = document.getElementById(id); if (again) { again.focus(); try { const n = again.value.length; again.setSelectionRange(n, n); } catch (err) {} }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
    if (e.key === "Tab" && $("#drawer").classList.contains("on")) {
      const f = $$("#drawer button, #drawer [href], #drawer input, #drawer select").filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  $("#scrim").addEventListener("click", closeDrawer);
  $("#theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("salin-theme", root.dataset.theme); } catch (err) {}
    renderTabs();
  });
  try { const th = localStorage.getItem("salin-theme"); if (th) document.documentElement.dataset.theme = th; } catch (err) {}

  let rz; let lastW = window.innerWidth;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.view === "today" && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; renderToday(); } }, 200); });
  window.addEventListener("hashchange", () => { const v = (location.hash || "").slice(1); if (v !== state.view) go(v); });
  const h = (location.hash || "").slice(1);
  state.view = ["today", "payday", "review", "plans", "welcome"].includes(h) ? h : "welcome";
  render();
})();

</script>
