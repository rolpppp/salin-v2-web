name: salin_mobile_compat
description: Round-trips web-written Supabase rows through the real Salin mobile models. Test-only package.
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  salin:
    # Resolves to the sibling mobile repo. Override with SALIN_MOBILE_PATH (see run.mjs).
    path: ../../../../salin-v2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift: any
