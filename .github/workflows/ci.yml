name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles only works at step level; steps are skipped until the DB ticket adds supabase/config.toml.
      - uses: supabase/setup-cli@v1
        if: hashFiles('supabase/config.toml') != ''
        with:
          version: latest
      - run: supabase start
        if: hashFiles('supabase/config.toml') != ''
      - run: supabase test db
        if: hashFiles('supabase/config.toml') != ''
