name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # E2E needs Auth + PostgREST: a throwaway local Supabase in the runner, never the live project.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start local Supabase
        run: |
          mkdir -p supabase/.temp && echo 17.6.1.147 > supabase/.temp/postgres-version
          supabase start -x edge-runtime,logflare,vector,imgproxy,studio,storage-api,postgres-meta,realtime
      - name: Point e2e at the local stack
        run: |
          supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/p; s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p' >> "$GITHUB_ENV"
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start local Supabase (database only)
        run: |
          mkdir -p supabase/.temp && echo 17.6.1.147 > supabase/.temp/postgres-version
          supabase start -x gotrue,kong,postgrest,edge-runtime,logflare,vector,imgproxy,studio,mailpit,storage-api,postgres-meta,realtime
      # Held migrations (D-16) aren't on live, but pgTAP 04 tests them.
      - run: for f in supabase/held/*.sql; do psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: supabase test db
